name: Build ProtoHax APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app (ProtoHax-Android)
        uses: actions/checkout@v4

      - name: Checkout core (ProtoHax)
        uses: actions/checkout@v4
        with:
          repository: accphu24/ProtoHax
          ref: stable
          path: protohax-core-src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & publish core to Maven Local
        run: |
          cd protohax-core-src
          chmod +x gradlew
          ./gradlew publishToMavenLocal --no-daemon

      - name: Build app APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: protohax-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
